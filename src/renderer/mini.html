<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Luzzy</title>
  <style>
    /* Mini-Modus: schmale Leiste oben mittig, nur Luzzys Stimme als Balken */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .pille {
      box-sizing: border-box; height: 100%; display: flex; align-items: center; justify-content: center; gap: 3px;
      padding: 0 14px; border-radius: 999px; cursor: pointer; position: relative;
      background: rgba(12, 12, 14, 0.9); border: 1px solid rgba(201, 161, 74, 0.35);
      transition: border-color 200ms;
    }
    .pille:hover { border-color: rgba(201, 161, 74, 0.8); }
    .balken { width: 3px; height: 3px; border-radius: 2px; background: #6b5a33; transition: height 70ms linear, background-color 200ms; }
    /* Luzzy spricht: gold · hört zu: hell · denkt: wandernde Welle · wartet: ruhige Punkte */
    [data-zustand='spricht'] .balken { background: #d9b25f; }
    [data-zustand='getrennt'] .balken { background: #5a3a36; }
    [data-zustand='hoert'] .balken { background: #ece6da; }
    [data-zustand='denkt'] .balken, [data-zustand='versteht'] .balken, [data-zustand='antwortet'] .balken { background: #c9a14a; animation: denken 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * 45ms); }
    @keyframes denken { 0%, 100% { height: 3px; } 50% { height: 12px; } }
    [data-zustand='bereit'] .balken { animation: atmen 3.2s ease-in-out infinite; }
    @keyframes atmen { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .gross {
      position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border: 0; padding: 0;
      border-radius: 50%; background: rgba(201, 161, 74, 0.15); color: #d9b25f; font-size: 11px; line-height: 18px; cursor: pointer;
      opacity: 0; transition: opacity 150ms;
    }
    .pille:hover .gross { opacity: 1; }
  </style>
</head>
<body>
  <div class="pille" id="pille" data-zustand="bereit" title="Luzzy · Klick: sprechen · Doppelklick: großes Fenster (Strg+Umschalt+M)">
    <button class="gross" id="gross" type="button" title="Großes Fenster">⤢</button>
  </div>
  <script src="mini.js"></script>
</body>
</html>
